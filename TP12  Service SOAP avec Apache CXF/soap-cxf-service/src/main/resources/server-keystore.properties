package com.acme.cxf.security;

import java.io.IOException;

/**
 * Propriétés Keystore pour WS-Security
 * Placer ce fichier dans src/main/resources/
 */

# Keystore location and password
org.apache.wss4j.crypto.provider=org.apache.wss4j.common.crypto.WSCryptoImpl
org.apache.wss4j.crypto.merlin.keystore.type=jks
